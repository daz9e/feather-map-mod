# Настройки Gradle; свойства мода — в stonecutter.properties.toml.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true
# Нужные JDK (17/21/25) скачиваются через foojay-тулчейны.
# Локальные пути к JDK (org.gradle.java.installations.paths, org.gradle.java.home)
# задаются в ~/.gradle/gradle.properties, а не в репозитории.
