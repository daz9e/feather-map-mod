name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Последняя версия в списке — JAVA_HOME для самого Gradle; остальные Gradle находит как тулчейны.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build all versions
        run: ./gradlew buildAll

      - uses: actions/upload-artifact@v4
        with:
          name: worldmap-jars
          path: build/libs/
          if-no-files-found: error
